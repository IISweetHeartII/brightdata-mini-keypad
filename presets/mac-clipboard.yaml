# 키1: Raycast Clipboard History (전역 핫키 ⌃⌥⌘V 필요)
# mac-shottr에서 키1만 변경. 물리 버튼 동작은 사용자 확인 필요.
model: ch57x-2
orientation: normal
rows: 1
columns: 3
knobs: 1

layers:
  - buttons:
      - ["ctrl-alt-cmd-v", "alt-shift-s", "ctrl-shift-power"]
      #  클립보드 기록      Shottr 영역     화면만 끄기
    knobs:
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"
